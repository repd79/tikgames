<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TikGamesX</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Black+Ops+One&family=Bowlby+One&family=Baloo+2:wght@800&family=Bungee&family=Caveat+Brush&family=Chewy&family=Cinzel:wght@900&family=Creepster&family=Dela+Gothic+One&family=Fredoka:wght@700&family=Lobster&family=Londrina+Solid:wght@900&family=Luckiest+Guy&family=Orbitron:wght@900&family=Pacifico&family=Patrick+Hand&family=Press+Start+2P&family=Righteous&family=Rye&family=Shrikhand&family=Silkscreen:wght@700&family=Sniglet:wght@800&family=Titan+One&family=VT323&family=Monoton&family=Archivo+Black&family=Space+Mono:wght@700&family=Abril+Fatface&family=Special+Elite&family=Bebas+Neue&family=Share+Tech+Mono&family=Rubik+Mono+One&family=Playfair+Display:wght@900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;justify-content:center;background:#000}
#feed{width:100%;max-width:480px;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;position:relative}
#feed::-webkit-scrollbar{display:none}
#probe{position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);pointer-events:none}
.card{position:relative;height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2))}
.poster{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 62%)}
.pe{font-size:128px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(0,0,0,.4))}
.pt{font-family:var(--font);font-size:38px;color:#fff;text-shadow:0 0 26px var(--ac),0 4px 0 rgba(0,0,0,.3);text-align:center;padding:0 18px;line-height:1.1}
.ps{font-weight:800;opacity:.7;letter-spacing:2px;font-size:13px;text-transform:uppercase}
.stage{position:absolute;inset:0;z-index:1}
.hud{position:absolute;inset:0;z-index:3;pointer-events:none}
.score{position:absolute;top:calc(env(safe-area-inset-top) + 50px);left:16px;font-family:var(--font);font-size:42px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px var(--ac);opacity:.92}
.score.pop{animation:pop .25s ease-out}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 100px);text-align:center;opacity:0;transition:opacity .4s}
.hint.on{opacity:1}
.hint span{display:inline-block;padding:9px 16px;border-radius:999px;background:rgba(0,0,0,.55);font-weight:800;font-size:15px;letter-spacing:.3px;animation:pulse 1.2s infinite}
.toast{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--font);font-size:26px;text-shadow:0 3px 10px #000a,0 0 16px var(--ac);opacity:0;transform:translateY(10px);transition:all .3s;padding:0 20px}
.toast.on{opacity:1;transform:none}
.intro{position:absolute;left:0;right:0;top:32%;z-index:4;text-align:center;font-family:var(--font);font-size:46px;line-height:1.05;padding:0 16px;color:#fff;text-shadow:0 0 22px var(--ac),0 5px 0 rgba(0,0,0,.35);opacity:0;pointer-events:none}
.card.active .intro{animation:intro 1.15s ease-out}
.over{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;font-family:var(--font);padding-bottom:70px}
.over.show{display:flex;animation:fade .3s}
.ot{font-size:34px;color:var(--ac);padding:0 14px;text-shadow:0 0 18px var(--ac)}
.os{font-size:92px;line-height:1}
.ob{opacity:.85;font-family:system-ui,sans-serif;font-weight:800;font-size:15px}
.or{margin-top:18px;padding:13px 24px;border-radius:999px;background:var(--ac);color:#000;font-family:system-ui,sans-serif;font-weight:900;font-size:15px;letter-spacing:.5px;animation:pulse 1s infinite}
.meta{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:26px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.meta b{display:block;font-size:17px;text-shadow:0 2px 6px #000}
.meta span{font-size:13px;opacity:.8;font-weight:700}
.heart{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:54px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;transition:transform .15s}
.heart:active{transform:scale(.88)}
.heart.on{color:#ff2d55;background:rgba(255,45,85,.2);animation:beat .4s}
.fh{position:absolute;z-index:9;font-size:22px;color:#ff2d55;pointer-events:none;animation:fly .9s ease-out forwards}
#top{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 14px 6px;display:flex;align-items:center;justify-content:center;gap:22px;pointer-events:none}
#top button{pointer-events:auto;background:none;border:0;color:#fff;font:800 16px system-ui,sans-serif;opacity:.6;padding:6px 2px;text-shadow:0 2px 6px #000a;border-bottom:3px solid transparent;cursor:pointer}
#top button.on{opacity:1;border-color:#fff}
#top #mute{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 8px);opacity:.85;border:0;font-size:20px}
#swipe{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:15;text-align:center;font-weight:800;pointer-events:none;opacity:0;transition:opacity .5s;max-width:480px;margin:auto;text-shadow:0 2px 8px #000}
#swipe.on{opacity:1;animation:bob 1.2s infinite}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
.endcard h2{font-family:'Bungee',sans-serif;font-size:30px}
.endcard button{margin-top:14px;padding:13px 24px;border-radius:999px;border:0;font-weight:900;font-size:15px;background:#fff;color:#000;cursor:pointer}
.nx{margin-top:10px;font-family:system-ui,sans-serif;font-weight:800;font-size:13px;letter-spacing:.4px;opacity:.75}
/* Skins: cambian el aspecto del HUD y de la pantalla de fin según la estética del juego */
.ic{display:inline-block;vertical-align:-.2em;flex:none}
.pe{color:var(--ac)}.pe .ic{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ac) 55%,transparent))}
.meta b{display:flex;align-items:center;gap:8px}.meta b .mi{display:inline-flex;color:var(--ac)}.sk-light .meta b .mi{color:#16161d}
.hint span{display:inline-flex;align-items:center;gap:8px}
.ob .ic{vertical-align:-.15em;margin-right:2px}
.eic{color:#fff;opacity:.9;margin-bottom:6px}.eic .ic{display:block;margin:0 auto}
.skipb{display:inline-flex;align-items:center;gap:6px}
#top #mute{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;color:#fff}

/* botones */
#top{gap:10px!important}
#top .seg{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,20,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);box-shadow:0 4px 18px rgba(0,0,0,.28)}
#top .seg button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:0;background:transparent;opacity:.72;font:800 14px system-ui,sans-serif;text-shadow:none;transition:background .2s,opacity .2s,transform .12s}
#top .seg button:active{transform:scale(.95)}
#top .seg button.on{opacity:1;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);border-color:transparent}
#top .seg .cn{font-style:normal;font-size:11px;background:#ff3d6e;color:#fff;border-radius:9px;padding:1px 6px;margin-left:1px}
#top #mute{position:static!important;margin-left:2px;width:40px;height:40px;border-radius:50%;background:rgba(10,10,20,.42);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.28);opacity:1;transition:transform .12s}
#top #mute:active{transform:scale(.9)}
#app.light #top .seg,#app.light #top #mute{background:rgba(255,255,255,.6);border-color:rgba(0,0,0,.08);box-shadow:0 4px 14px rgba(0,0,0,.12)}
#app.light #top .seg button.on{background:rgba(0,0,0,.09);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
#app.light #top #mute{color:#16161d}
.heart{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18)!important;font-size:0;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.heart svg{transition:fill .2s,stroke .2s,transform .2s}
.heart.on{color:#ff3d6e;background:rgba(255,61,110,.18);border-color:rgba(255,61,110,.5)!important}
.heart.on svg{fill:#ff3d6e;stroke:#ff3d6e}
.fh{display:flex}
.or{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 82%,#fff),var(--ac))!important;box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 55%,#000),0 10px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35)}
.or .ic{animation:none}
.sk-flat .or{box-shadow:4px 4px 0 rgba(0,0,0,.6)!important;border:0}
.skipb{background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sk-light .skipb{background:rgba(255,255,255,.65);border-color:rgba(0,0,0,.08)}
.endcard button{display:inline-flex;align-items:center;gap:8px}
.card.embed .hud .score,.card.embed .poster .ps{display:none}
.card.embed .intro{top:18%}
.eg{position:absolute;top:0;bottom:0;width:14px;z-index:2;touch-action:pan-y}.eg.l{left:0}.eg.r{right:0}
.skipb{position:absolute;z-index:8;right:78px;bottom:calc(env(safe-area-inset-bottom) + 24px);height:34px;padding:0 14px;border-radius:17px;border:0;background:rgba(255,255,255,.16);color:#fff;font:800 13px system-ui,sans-serif;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.sk-light .skipb{background:rgba(0,0,0,.1);color:#16161d}
.sk-flat .score,.sk-flat .toast,.sk-flat .intro{text-shadow:3px 3px 0 rgba(0,0,0,.55)}
.sk-flat .ot{text-shadow:3px 3px 0 rgba(0,0,0,.6)}
.sk-flat .over{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.72)}
.sk-flat .or{border-radius:0;animation:none;box-shadow:4px 4px 0 rgba(0,0,0,.6)}
.sk-flat .meta{background:linear-gradient(transparent,rgba(0,0,0,.8))}
.sk-flat .heart{border-radius:6px;backdrop-filter:none;-webkit-backdrop-filter:none}
.sk-light .score{color:#16161d;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.sk-light .hint span{background:rgba(255,255,255,.82);color:#16161d}
.sk-light .toast{color:#16161d;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.sk-light .intro{color:#16161d;text-shadow:0 4px 0 rgba(255,255,255,.65)}
.sk-light .over{background:rgba(250,246,238,.82);backdrop-filter:none;-webkit-backdrop-filter:none;color:#16161d}
.sk-light .ot{text-shadow:none;color:#16161d}
.sk-light .or{color:#fff;mix-blend-mode:normal}
.sk-light .meta{background:linear-gradient(transparent,rgba(255,255,255,.78))}
.sk-light .meta b,.sk-light .meta span{color:#16161d;text-shadow:none}
.sk-light .heart{background:rgba(0,0,0,.09);color:#16161d;backdrop-filter:none;-webkit-backdrop-filter:none}
.sk-light .poster .pt{text-shadow:0 3px 0 rgba(255,255,255,.6);color:#16161d}
#app.light #top button{color:#16161d;text-shadow:none}
#app.light #top button.on{border-color:#16161d}
#app.light #swipe{color:#16161d;text-shadow:none}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes pop{0%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes intro{0%{opacity:0;transform:scale(2.4) rotate(-4deg)}22%{opacity:1;transform:scale(1) rotate(0)}75%{opacity:1}100%{opacity:0;transform:scale(.92)}}
@keyframes fade{from{opacity:0}}
@keyframes beat{40%{transform:scale(1.35)}}
@keyframes fly{to{transform:translate(var(--dx),-130px) scale(1.5);opacity:0}}
@keyframes shine{to{background-position:300% 0}}
@keyframes bob{50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="probe"></div>
<div id="app">
  <div id="top"><div class="seg"><button id="tab-all" class="on">Para ti</button><button id="tab-favs">Favoritos</button></div><button id="mute"></button></div>
  <div id="feed"></div>
  <div id="swipe">▲<br>desliza para otro juego</div>
</div>
<script>window.GAMES=[];window.def=function(g){GAMES.push(g)};</script>

<script src="js/games/g4.js"></script>
<script src="js/games/g5.js"></script>
<script src="js/games/g6.js"></script>
<script src="js/games/g7.js"></script>
<script src="js/games/g8.js"></script>
<script src="js/games/g9.js"></script>
<script src="js/games/g10.js"></script>
<script src="js/games/g11.js"></script>
<script src="js/games/g12.js"></script>
<script src="js/games/g13.js"></script>
<script src="js/games/g14.js"></script>
<script src="js/games/g15.js"></script>

</body>

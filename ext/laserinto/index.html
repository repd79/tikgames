<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LASERINTO · Laser Maze</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1028'/%3E%3Cpath d='M8 44H30V18H50' fill='none' stroke='%23ff3b55' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='18' r='7' fill='%23ffcf3f'/%3E%3C/svg%3E">
<style>
:root{--ink:#f1f4ff;--dim:#9aa6d8;--gold:#ffcf3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1028;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:"Baloo 2","Fredoka","Nunito",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-weight:700}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:10px 12px 2px;z-index:2}
#title{flex:1;text-align:center;line-height:1.1}
#ttl{font-weight:800;letter-spacing:.04em;font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#sub{font-size:12px;color:var(--dim);font-weight:700}
#stat{display:flex;flex-direction:column;gap:3px;align-items:flex-end;min-width:70px}
.chip{font-size:12px;background:rgba(255,255,255,.1);border-radius:99px;padding:2px 9px;color:#dfe6ff;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold)}
#tip{min-height:34px;padding:2px 18px 4px;text-align:center;font-size:13.5px;color:#c9d3ff;display:flex;align-items:center;justify-content:center;z-index:2;font-weight:600}
#tip.warn{color:#ff8f8f;font-weight:800}
#stage{flex:1;min-height:0;position:relative}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ctrl{display:flex;justify-content:center;gap:10px;padding:8px 12px calc(12px + env(safe-area-inset-bottom));z-index:2}
button{font:inherit;color:var(--ink);cursor:pointer}
.ib{background:#3a4687;border:none;border-bottom:4px solid #222b5c;border-radius:16px;padding:8px 14px 6px;font-size:20px;min-width:62px;transition:transform .08s,border-bottom-width .08s,background .15s;font-weight:800}
.ib:hover{background:#4756a3}
.ib:active{transform:translateY(3px);border-bottom-width:1px}
.ib[disabled]{opacity:.4;pointer-events:none}
.ib small{display:block;font-size:10.5px;color:#b8c4f5;margin-top:0;font-weight:700}
#bMenu{min-width:50px;padding:8px 12px;font-size:20px}
.overlay{position:fixed;inset:0;background:rgba(6,9,26,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;justify-content:center;overflow-y:auto;z-index:10}
.overlay.hidden{display:none}
.mwrap{width:min(560px,100%);padding:22px 16px 40px;position:relative}
.mwrap h1{margin:6px 0 0;text-align:center;font-size:54px;letter-spacing:.14em;font-weight:900;color:#fff;text-shadow:0 4px 0 #b3162d,0 0 30px rgba(255,59,85,.6)}
.mwrap p.sub{text-align:center;color:var(--dim);margin:6px 0 18px;font-size:14px}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.big{flex:1 1 140px;border:none;border-bottom:5px solid #b3162d;border-radius:18px;padding:14px 10px 10px;font-weight:800;font-size:17px;background:#ff3b55;color:#fff;transition:transform .08s,border-bottom-width .08s}
.big small{font-weight:700;opacity:.85;font-size:12px}
.big.alt{background:#5b6cff;border-bottom-color:#323fb8}
.big.alt2{background:#19c8a0;border-bottom-color:#0c8a6c;color:#04281f}
.big:active{transform:translateY(4px);border-bottom-width:1px}
.wt{margin:22px 4px 8px;font-size:13px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;border-radius:16px;border:none;border-bottom:4px solid #1b2350;background:#2e3977;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;transition:transform .08s}
.lv:hover{background:#3a4890}
.lv:active{transform:translateY(3px)}
.lv i{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--gold);min-height:12px}
.lv.lock{opacity:.35;pointer-events:none}
.lv.done{background:#1f6e5a;border-bottom-color:#124a3c}
.xbtn{position:absolute;right:10px;top:12px;min-width:44px;font-size:18px}
#win .card{margin:auto;width:min(380px,92%);background:linear-gradient(180deg,#2a3678,#162056);border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:26px 22px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 70px rgba(93,255,158,.18);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#win h2{margin:0 0 4px;font-size:34px;font-weight:900}
#win .stars{font-size:52px;letter-spacing:6px;margin:6px 0;color:var(--gold);text-shadow:0 3px 0 #a56a00,0 0 24px rgba(255,207,63,.7)}
#win .stars span.off{color:#46508e;text-shadow:none}
#win p{color:#b8c4f5;margin:2px 0 18px;font-size:14px}
#win .row{display:flex;gap:10px}
#win .row button{flex:1}

#flash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fff 0,#ffd9a0 35%,rgba(255,120,40,.35) 65%,transparent 85%)}
/* iconos */
.ico{display:block;width:26px;height:26px;margin:0 auto;line-height:0}
.ico svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ico-s{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin:0 2px}
#bMenu .ico{width:24px;height:24px}
#bUndo .ico,#bReset .ico{color:#dfe6ff}
#bHint .ico{color:#ffd23f;filter:drop-shadow(0 0 5px rgba(255,210,63,.55))}
#bSnd .ico{color:#8fe3ff}
#stat{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:152px;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip svg:first-child{color:#8fe3ff}
.chip.boom{color:#ffb070;background:rgba(255,120,40,.18)}
.big .ico-s{width:20px;height:20px;vertical-align:-5px}
.big.alt2 .ico-s{color:#04281f}
.xbtn .ico{width:20px;height:20px}
.logo{width:min(250px,70%);margin:2px auto 0;filter:drop-shadow(0 6px 16px rgba(255,59,85,.35))}
.logo svg{width:100%;display:block}
.mwrap h1{font-size:clamp(34px,11vw,54px);margin-top:2px}
.starin svg{stroke:none}
.lv > svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin:3px 0 2px;color:#8f9bd8}
.lv i{display:flex;gap:1px;align-items:center;justify-content:center}
.lv i svg{width:11px;height:11px;display:block;overflow:visible;stroke-linejoin:round}
#win .stars{display:flex;justify-content:center;gap:4px;font-size:0}
#win .stars span{display:block;width:56px;height:56px}
#win .stars svg{width:100%;height:100%;display:block;overflow:visible;stroke-linejoin:round;filter:drop-shadow(0 3px 0 rgba(165,106,0,.9)) drop-shadow(0 0 14px rgba(255,207,63,.55))}
#win .stars span.off svg{filter:none}
#win .row button .ico-s{vertical-align:-4px}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffcf3f"/><stop offset="1" stop-color="#ff9d1c"/></linearGradient></defs></svg>
<div id="flash"></div>
<div id="app">
  <header id="top">
    <button class="ib" id="bMenu" title="Niveles"><span class="ico" data-ic="levels"></span></button>
    <div id="title"><div id="ttl">Nivel 1</div><div id="sub"></div></div>
    <div id="stat"></div>
  </header>
  <div id="tip"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <footer id="ctrl">
    <button class="ib" id="bUndo"><span class="ico" data-ic="undo"></span><small>Deshacer</small></button>
    <button class="ib" id="bReset"><span class="ico" data-ic="restart"></span><small>Reiniciar</small></button>
    <button class="ib" id="bHint"><span class="ico" data-ic="hint"></span><small>Pista</small></button>
    <button class="ib" id="bSnd"><span class="ico" data-ic="sound"></span><small>Sonido</small></button>
  </footer>
</div>
<div id="menu" class="overlay hidden"></div>
<div id="win" class="overlay hidden"><div class="card" id="winCard"></div></div>
